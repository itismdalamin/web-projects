<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="mouse-glow" id="mouse-glow"></div>

<div class="side-art left" aria-hidden="true">
  <div class="orbit"></div>
  <div class="orb one">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--x)" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
  <div class="orb two">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--o)" stroke-width="1.9"><circle cx="12" cy="12" r="7.5"/></svg>
  </div>
  <div class="orb three">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
  </div>
  <div class="side-caption">make your move</div>
</div>

<div class="side-art right" aria-hidden="true">
  <div class="orbit"></div>
  <div class="orb one">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--o)" stroke-width="1.9"><circle cx="12" cy="12" r="7.5"/></svg>
  </div>
  <div class="orb two">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
  </div>
  <div class="orb three">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--x)" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
  <div class="side-caption">three in a row wins</div>
</div>

<div class="topbar">
  <div class="brand-wrap"><div class="brand"><span class="mark"></span>OXO Duel</div><a class="credit" href="https://github.com/itismdalamin" target="_blank" rel="noopener">coded by Md Al-Amin</a></div>
  <div class="theme-toggle" role="group" aria-label="Theme switch">
    <button id="btn-light" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="btn-dark" class="active" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<main>
  <div class="title-block">
    <div class="eyebrow" id="eyebrow">Human VS Computer</div>
    <h1>Tic-Tac-Toe</h1>
  </div>

  <div class="mode-toggle" role="group" aria-label="Game mode">
    <button id="btn-vs-computer" class="active" data-mode="computer">Vs Computer</button>
    <button id="btn-vs-player" data-mode="player">Vs Player</button>
  </div>

  <div class="game-layout">
    <section class="play-panel">
      <div class="arena">
        <div class="duel" id="duel">
          <div class="duel-side">
            <div class="duel-icon-wrap active" id="p1-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--x)" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </div>
            <div class="duel-tag" id="p1-tag">You</div>
          </div>
          <div class="vs">VS</div>
          <div class="duel-side">
            <div class="duel-icon-wrap" id="p2-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--o)" stroke-width="1.9"><circle cx="12" cy="12" r="7.5"/></svg>
            </div>
            <div class="duel-tag" id="p2-tag">Computer</div>
          </div>
        </div>
      </div>

      <div class="result-banner" id="result-banner">X's turn</div>

      <div class="board" id="board">
        <button class="cell" data-cell="0" aria-label="Cell 1"></button>
        <button class="cell" data-cell="1" aria-label="Cell 2"></button>
        <button class="cell" data-cell="2" aria-label="Cell 3"></button>
        <button class="cell" data-cell="3" aria-label="Cell 4"></button>
        <button class="cell" data-cell="4" aria-label="Cell 5"></button>
        <button class="cell" data-cell="5" aria-label="Cell 6"></button>
        <button class="cell" data-cell="6" aria-label="Cell 7"></button>
        <button class="cell" data-cell="7" aria-label="Cell 8"></button>
        <button class="cell" data-cell="8" aria-label="Cell 9"></button>
      </div>
    </section>

    <aside class="side-panel">
      <div class="result-card">
        <div class="panel-label">Game status</div>
        <div class="result-banner" id="result-banner-mobile">X's turn</div>
      </div>
        
    <div class="scoreboard">
      <div class="score-item" id="score-x">
        <div class="score-num">0</div>
        <div class="score-label" id="label-x">You Won</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <div class="score-num" id="draw-num" style="color:var(--tie)">0</div>
        <div class="score-label">Draws</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item" id="score-o">
        <div class="score-num">0</div>
        <div class="score-label" id="label-o">COM Won</div>
      </div>
    </div>
    
      <button class="reset-btn" id="reset-btn">Reset score</button>
    </aside>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
