<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock-Paper-Scissors</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="mouse-glow" id="mouse-glow"></div>

<div class="side-art left" aria-hidden="true">
  <div class="orbit"></div>
  <div class="orb one">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--rock)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12.5V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11.5V6.5a2 2 0 1 1 4 0V13a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L3.3 13a1.6 1.6 0 0 1 2.6-1.8L7 13"/>
    </svg>
  </div>
  <div class="orb two">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--paper)" stroke-width="1.7">
      <rect x="5" y="3.5" width="14" height="17" rx="2"/>
      <path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
    </svg>
  </div>
  <div class="orb three">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--scissors)" stroke-width="1.7" stroke-linecap="round">
      <circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/>
      <path d="M7.8 7.5 20 19M7.8 16.5 20 5"/>
    </svg>
  </div>
  <div class="side-caption">choose your move</div>
</div>

<div class="side-art right" aria-hidden="true">
  <div class="orbit"></div>
  <div class="orb one">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--paper)" stroke-width="1.7">
      <rect x="5" y="3.5" width="14" height="17" rx="2"/>
      <path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
    </svg>
  </div>
  <div class="orb two">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--scissors)" stroke-width="1.7" stroke-linecap="round">
      <circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/>
      <path d="M7.8 7.5 20 19M7.8 16.5 20 5"/>
    </svg>
  </div>
  <div class="orb three">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--rock)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12.5V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11.5V6.5a2 2 0 1 1 4 0V13a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L3.3 13a1.6 1.6 0 0 1 2.6-1.8L7 13"/>
    </svg>
  </div>
  <div class="side-caption">human vs computer</div>
</div>

<div class="topbar">
  <div class="brand-wrap">
    <div class="brand"><span class="mark"></span>Throw</div>
    <a href="https://github.com/itismdalamin" target="_blank" rel="noopener" class="credit">coded by Md Al-Amin</a>
  </div>
  <div class="theme-toggle" role="group" aria-label="Theme switch">
    <button id="btn-light" class="active" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="btn-dark" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<main>
  <div class="title-block">
    <div class="eyebrow">Human vs Computer</div>
    <h1>Rock-Paper-Scissors</h1>
  </div>

  <div class="arena">
    <div class="duel" id="duel">
      <div class="duel-side">
        <div class="duel-icon-wrap" id="you-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg>
        </div>
        <div class="duel-tag">You</div>
      </div>
      <div class="vs">VS</div>
      <div class="duel-side">
        <div class="duel-icon-wrap" id="cpu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg>
        </div>
        <div class="duel-tag">Computer</div>
      </div>
    </div>
  </div>

  <div class="result-banner" id="result-banner">Make the first move</div>

  <div class="choices">
    <div class="choice-item">
      <button class="choice-btn" data-choice="rock" aria-label="Play rock">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--rock)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 12.5V7a2 2 0 1 1 4 0v4M11 11V5a2 2 0 1 1 4 0v6M15 11.5V6.5a2 2 0 1 1 4 0V13a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L3.3 13a1.6 1.6 0 0 1 2.6-1.8L7 13"/>
        </svg>
      </button>
      <span class="choice-label">Rock</span>
    </div>
    <div class="choice-item">
      <button class="choice-btn" data-choice="paper" aria-label="Play paper">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3.5" width="14" height="17" rx="2"/>
          <path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
        </svg>
      </button>
      <span class="choice-label">Paper</span>
    </div>
    <div class="choice-item">
      <button class="choice-btn" data-choice="scissors" aria-label="Play scissors">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--scissors)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/>
          <path d="M7.8 7.5 20 19M7.8 16.5 20 5"/>
        </svg>
      </button>
      <span class="choice-label">Scissors</span>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-item" id="score-win">
      <div class="score-num">0</div>
      <div class="score-label">Wins</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-item">
      <div class="score-num" id="tie-num" style="color:var(--tie)">0</div>
      <div class="score-label">Ties</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-item" id="score-lose">
      <div class="score-num">0</div>
      <div class="score-label">Losses</div>
    </div>
  </div>

  <div class="footer-row">
    <button class="reset-btn" id="reset-btn">Reset score</button>
  </div>
</main>

<script src="script.js"></script>

</body>
</html>
